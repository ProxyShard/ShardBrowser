          ckRhdGEiKSB7CiAgICAgICAgICB0cmFuc2xhdGVUZXh0Tm9kZShtLnRhcmdldCBhcyBUZXh0KTsKICAgICAgICB9CiAgICAgICAg
          Zm9yIChjb25zdCBuIG9mIEFycmF5LmZyb20obS5hZGRlZE5vZGVzKSkgd2FsayhuKTsKICAgICAgICBpZiAobS50eXBlID09PSAi
          YXR0cmlidXRlcyIgJiYgbS50YXJnZXQgaW5zdGFuY2VvZiBFbGVtZW50KSB7CiAgICAgICAgICB0cmFuc2xhdGVBdHRyaWJ1dGVz
          KG0udGFyZ2V0KTsKICAgICAgICB9CiAgICAgIH0KICAgIH0pOwoKICAgIG9ic2VydmVyLm9ic2VydmUoZG9jdW1lbnQuYm9keSwg
          ewogICAgICBzdWJ0cmVlOiB0cnVlLAogICAgICBjaGlsZExpc3Q6IHRydWUsCiAgICAgIGNoYXJhY3RlckRhdGE6IHRydWUsCiAg
          ICAgIGF0dHJpYnV0ZXM6IHRydWUsCiAgICAgIGF0dHJpYnV0ZUZpbHRlcjogWy4uLmF0dHJzXSwKICAgIH0pOwogIH07CgogIGlm
          IChkb2N1bWVudC5ib2R5KSBzdGFydCgpOwogIGVsc2Ugd2luZG93LmFkZEV2ZW50TGlzdGVuZXIoIkRPTUNvbnRlbnRMb2FkZWQi
          LCBzdGFydCwgeyBvbmNlOiB0cnVlIH0pOwp9Cg==
          '@
          $clean = $b64 -replace "\s", ""
          [IO.File]::WriteAllBytes("src/zh-cn.ts", [Convert]::FromBase64String($clean))

          $main = Get-Content "src/main.tsx" -Raw -Encoding UTF8
          if ($main -notmatch 'installZhCN') {
            $main = $main.Replace(
              'import App from "./App";',
              "import App from `"./App`";`r`nimport { installZhCN } from `"./zh-cn`";"
            )
            $main = $main + "`r`n`r`ninstallZhCN();`r`n"
            Set-Content "src/main.tsx" $main -Encoding UTF8
          }

          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw -Encoding UTF8
          $conf = $conf.Replace('"title": "ShardX Launcher"', '"title": "ShardX Launcher 中文版"')
          Set-Content $confPath $conf -Encoding UTF8

      - name: Build Chinese Windows version
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Prepare downloadable EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifact" | Out-Null
          $release = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $source = Join-Path $release "ShardX Launcher.exe"
          if (-not (Test-Path $source)) {
            $source = Join-Path $release "shardx-launcher.exe"
          }
          if (-not (Test-Path $source)) {
            $source = Get-ChildItem $release -Filter "*.exe" -File |
              Where-Object { $_.Name -notmatch "build|setup" } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $source -or -not (Test-Path $source)) {
            throw "Could not find compiled ShardX Launcher EXE."
          }
          Copy-Item $source "artifact/ShardX-Launcher-中文版.exe"

          $msi = Get-ChildItem "$release/bundle" -Recurse -Filter "*.msi" -File -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "artifact/ShardX-Launcher-中文版.msi"
          }

      - name: Upload Chinese build
        uses: actions/upload-artifact@v4
        with:
          name: ShardX-Launcher-Chinese-Windows
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
